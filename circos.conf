<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>

<image>
<<include etc/image.conf>>
#file  = circos.png
#radius = 1500p
</image>

karyotype = karyotype.txt

<ideogram>

show_label       = yes
label_font       = default 
label_radius     = 1r + 75p
label_size       = 40
label_parallel   = yes

<spacing>
default = 0.005r
</spacing>

radius    = 0.90r
thickness = 40p
fill      = yes
</ideogram>


<plots>


########################
# gene annotation ring
########################

<plot>
type    = heatmap
file    = ../snp_density/gene_counts_20kb_winds.txt
#color   = spectral-5-div
#color   = spectral-11-div
color   = purples-9-seq
scale_log_base   = 0.5
r1   = 0.90r
r0   = 0.80r
#margin      = 0.05u
#orientation = center
#thickness = 50
#padding = 8
</plot>

###################
### SNP heatmap ###
###################

<plot>
type    = heatmap
file    = ../snp_density/snp_counts_20kb_winds.txt
#color   = spectral-11-div
color   = blues-9-seq
scale_log_base   = 0.5
r1      = 0.78r
r0      = 0.68r
</plot>


#################################
### GC CONTENT ANNOTAION RING ###
#################################

<plot>
type  = histogram
file  = gc_dev.txt
r0    = 0.56r
r1    = 0.66r

fill_color = grey
thickness  = 1
extend_bin = no

<rules>
<rule>
condition  = var(value) > 0
fill_color = lgreen
</rule>
<rule>
condition  = var(value) < 0
fill_color = vdgreen
</rule>
</rules>


</plot>





</plots>
